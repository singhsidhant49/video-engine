name: videoforge

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://video:${POSTGRES_PASSWORD:-video_dev_password}@postgres:5432/videogenerator
  REDIS_URL: redis://redis:6379/0
  VIDEO_JOB_STORE: postgres
  VIDEO_QUEUE_BACKEND: bullmq
  VIDEO_API_KEYS: ${VIDEO_API_KEYS:-replace-this-before-exposing-the-api}
  VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}
  VIDEO_QUEUE_LOCK_MS: ${VIDEO_QUEUE_LOCK_MS:-600000}
  VIDEO_QUEUE_LOCK_RENEW_MS: ${VIDEO_QUEUE_LOCK_RENEW_MS:-30000}
  VIDEO_QUEUE_STALLED_INTERVAL_MS: ${VIDEO_QUEUE_STALLED_INTERVAL_MS:-60000}
  VIDEO_QUEUE_MAX_STALLED_COUNT: ${VIDEO_QUEUE_MAX_STALLED_COUNT:-2}
  REMOTION_CONCURRENCY: ${REMOTION_CONCURRENCY:-1}
  VIDEO_MOTION_PRESET: ${VIDEO_MOTION_PRESET:-standard}
  VIDEO_MAX_QUEUED_JOBS: ${VIDEO_MAX_QUEUED_JOBS:-25}
  VIDEO_MAX_OWNER_PENDING_JOBS: ${VIDEO_MAX_OWNER_PENDING_JOBS:-5}
  VIDEO_SHUTDOWN_TIMEOUT_MS: ${VIDEO_SHUTDOWN_TIMEOUT_MS:-30000}
  VIDEO_API_MAX_REQUEST_BYTES: ${VIDEO_API_MAX_REQUEST_BYTES:-1mb}
  KOKORO_TTS_URL: http://kokoro:8880/v1/audio/speech
  KOKORO_VOICE: ${KOKORO_VOICE:-af_bella}
  KOKORO_SPEED: ${KOKORO_SPEED:-0.9}
  KOKORO_MEDITATION_SPEED: ${KOKORO_MEDITATION_SPEED:-0.58}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  PEXELS_API_KEY: ${PEXELS_API_KEY:-}
  PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
  BRAVE_SEARCH_KEY: ${BRAVE_SEARCH_KEY:-}
  HF_HOME: /app/.cache/huggingface
  XDG_CACHE_HOME: /app/.cache
  TRANSFORMERS_CACHE: /app/.cache/huggingface
  NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=4096 --expose-gc}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: videogenerator
      POSTGRES_USER: video
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d videogenerator"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-63790}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped
    ports:
      # Keep localhost as the safe default. Set KOKORO_BIND_IP to a trusted LAN
      # address only when another machine must call the provider directly.
      - "${KOKORO_BIND_IP:-127.0.0.1}:${KOKORO_PORT:-8880}:8880"
    expose:
      - "8880"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/docs', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 20s

  storage-init:
    image: videoforge-worker
    user: root
    command: ["sh", "-c", "chown -R node:node /app/renders /app/.cache"]
    restart: "no"
    volumes:
      - video_data:/app/renders
      - engine_cache:/app/.cache

  api:
    build: .
    restart: unless-stopped
    init: true
    environment:
      <<: *app-environment
      VIDEO_PROCESS_ROLE: api
      PORT: 3000
    ports:
      # The authenticated API is reachable from trusted devices on the LAN.
      # PostgreSQL and Redis remain local; Kokoro is local unless explicitly LAN-bound.
      - "${VIDEO_API_BIND_IP:-0.0.0.0}:${VIDEO_API_PORT:-3000}:3000"
    volumes:
      - video_data:/app/renders
      - engine_cache:/app/.cache
      - ./public/media-bank:/app/public/media-bank
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      worker: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    init: true
    command: ["npm", "run", "worker"]
    environment:
      <<: *app-environment
      VIDEO_PROCESS_ROLE: worker
    shm_size: "2gb"
    volumes:
      - video_data:/app/renders
      - engine_cache:/app/.cache
      - ./public/media-bank:/app/public/media-bank
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kokoro: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }

volumes:
  postgres_data:
  redis_data:
  video_data:
  engine_cache:
