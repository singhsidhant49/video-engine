name: videoforge

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://video:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/videogenerator
  REDIS_URL: redis://redis:6379/0
  VIDEO_JOB_STORE: postgres
  VIDEO_QUEUE_BACKEND: bullmq
  VIDEO_API_KEYS: ${VIDEO_API_KEYS:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set to a strong 12+ character password}
  ADMIN_OWNER_ID: ${ADMIN_OWNER_ID:-acct_primary}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a 32+ character random secret}
  JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-28800}
  VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}
  VIDEO_QUEUE_GLOBAL_CONCURRENCY: ${VIDEO_QUEUE_GLOBAL_CONCURRENCY:-1}
  VIDEO_QUEUE_LOCK_MS: ${VIDEO_QUEUE_LOCK_MS:-600000}
  VIDEO_QUEUE_LOCK_RENEW_MS: ${VIDEO_QUEUE_LOCK_RENEW_MS:-30000}
  VIDEO_QUEUE_STALLED_INTERVAL_MS: ${VIDEO_QUEUE_STALLED_INTERVAL_MS:-60000}
  VIDEO_QUEUE_MAX_STALLED_COUNT: ${VIDEO_QUEUE_MAX_STALLED_COUNT:-2}
  REMOTION_CONCURRENCY: ${REMOTION_CONCURRENCY:-1}
  # Long-form renders are split into atomic pieces so a low-resource VPS can
  # resume after a worker restart without encoding the whole video again.
  REMOTION_SEGMENTED_RENDER_ENABLED: ${REMOTION_SEGMENTED_RENDER_ENABLED:-true}
  REMOTION_SEGMENTED_RENDER_MIN_SECONDS: ${REMOTION_SEGMENTED_RENDER_MIN_SECONDS:-180}
  REMOTION_SEGMENT_SECONDS: ${REMOTION_SEGMENT_SECONDS:-60}
  RUNS_RETENTION_DAYS: ${RUNS_RETENTION_DAYS:-7}
  RUNS_CLEANUP_INTERVAL_HOURS: ${RUNS_CLEANUP_INTERVAL_HOURS:-12}
  CACHE_RETENTION_DAYS: ${CACHE_RETENTION_DAYS:-14}
  VIDEO_MOTION_PRESET: ${VIDEO_MOTION_PRESET:-standard}
  VIDEO_MAX_QUEUED_JOBS: ${VIDEO_MAX_QUEUED_JOBS:-25}
  VIDEO_MAX_OWNER_PENDING_JOBS: ${VIDEO_MAX_OWNER_PENDING_JOBS:-5}
  VIDEO_MAX_CHANNEL_PENDING_JOBS: ${VIDEO_MAX_CHANNEL_PENDING_JOBS:-2}
  VIDEO_ESTIMATED_JOB_MINUTES: ${VIDEO_ESTIMATED_JOB_MINUTES:-20}
  AI_IMAGE_ESTIMATED_COST_USD: ${AI_IMAGE_ESTIMATED_COST_USD:-0.003}
  LLM_ESTIMATED_COST_PER_VIDEO_USD: ${LLM_ESTIMATED_COST_PER_VIDEO_USD:-0.02}
  VIDEO_SHUTDOWN_TIMEOUT_MS: ${VIDEO_SHUTDOWN_TIMEOUT_MS:-30000}
  VIDEO_JOB_TIMEOUT_MS: ${VIDEO_JOB_TIMEOUT_MS:-5400000}
  VIDEO_JOB_MAX_TIMEOUT_MS: ${VIDEO_JOB_MAX_TIMEOUT_MS:-43200000}
  VIDEO_AUTOMATIC_RETRY_LIMIT: ${VIDEO_AUTOMATIC_RETRY_LIMIT:-2}
  ASSET_PRIMARY_MATERIALIZATION_ATTEMPTS: ${ASSET_PRIMARY_MATERIALIZATION_ATTEMPTS:-6}
  ASSET_EMERGENCY_MATERIALIZATION_ATTEMPTS: ${ASSET_EMERGENCY_MATERIALIZATION_ATTEMPTS:-3}
  VIDEO_API_MAX_REQUEST_BYTES: ${VIDEO_API_MAX_REQUEST_BYTES:-1mb}
  VIDEO_API_RATE_LIMIT_PER_MINUTE: ${VIDEO_API_RATE_LIMIT_PER_MINUTE:-120}
  VIDEO_SHARED_SENSITIVE_CACHE: ${VIDEO_SHARED_SENSITIVE_CACHE:-false}
  KOKORO_TTS_URL: http://kokoro:8880/v1/audio/speech
  KOKORO_VOICE: ${KOKORO_VOICE:-af_bella}
  KOKORO_SPEED: ${KOKORO_SPEED:-0.9}
  KOKORO_MEDITATION_SPEED: ${KOKORO_MEDITATION_SPEED:-0.72}
  KOKORO_RETRY_ATTEMPTS: ${KOKORO_RETRY_ATTEMPTS:-5}
  KOKORO_RETRY_BASE_DELAY_MS: ${KOKORO_RETRY_BASE_DELAY_MS:-1000}
  # Local Whisper is optional. Long narration uses deterministic timing so a
  # small CPU-only VPS cannot be pinned indefinitely during alignment.
  WHISPER_ENABLED: ${WHISPER_ENABLED:-auto}
  WHISPER_MAX_AUDIO_SECONDS: ${WHISPER_MAX_AUDIO_SECONDS:-90}
  WHISPER_TIMEOUT_MS: ${WHISPER_TIMEOUT_MS:-60000}
  WHISPER_MODEL: ${WHISPER_MODEL:-Xenova/whisper-base.en}
  ALLOW_ESTIMATED_ALIGNMENT: ${ALLOW_ESTIMATED_ALIGNMENT:-true}
  ALLOW_UNVERIFIED_CLAIMS: ${ALLOW_UNVERIFIED_CLAIMS:-true}
  STRICT_CONTENT_QUALITY: ${STRICT_CONTENT_QUALITY:-false}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  PEXELS_API_KEY: ${PEXELS_API_KEY:-}
  PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
  BRAVE_SEARCH_KEY: ${BRAVE_SEARCH_KEY:-}
  IDEOGRAM_API_KEY: ${IDEOGRAM_API_KEY:-}
  IDEOGRAM_API_URL: ${IDEOGRAM_API_URL:-}
  IDEOGRAM_MODEL: ${IDEOGRAM_MODEL:-p-image-ideogram}
  IDEOGRAM_QUALITY: ${IDEOGRAM_QUALITY:-medium}
  IDEOGRAM_RESOLUTION: ${IDEOGRAM_RESOLUTION:-1k}
  REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-${FluxSchellKey:-}}
  REPLICATE_MIN_REQUEST_INTERVAL_MS: ${REPLICATE_MIN_REQUEST_INTERVAL_MS:-0}
  FluxSchellKey: ${FluxSchellKey:-}
  FLUX_MODEL: ${FLUX_MODEL:-black-forest-labs/flux-schnell}
  YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
  YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
  YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
  YOUTUBE_OAUTH_STATE_SECRET: ${YOUTUBE_OAUTH_STATE_SECRET:-}
  YOUTUBE_TOKEN_ENCRYPTION_KEY: ${YOUTUBE_TOKEN_ENCRYPTION_KEY:-}
  YOUTUBE_UPLOAD_TIMEOUT_MS: ${YOUTUBE_UPLOAD_TIMEOUT_MS:-3600000}
  # Publishing remains deliberately off until the upload workflow is re-enabled and audited.
  YOUTUBE_PUBLISHING_ENABLED: ${YOUTUBE_PUBLISHING_ENABLED:-false}
  HF_HOME: /app/.cache/huggingface
  XDG_CACHE_HOME: /app/.cache
  TRANSFORMERS_CACHE: /app/.cache/huggingface
  NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=4096 --expose-gc}
  MEDIA_BANK_DIR: ${MEDIA_BANK_DIR:-/app/storage/media-bank}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    environment:
      POSTGRES_DB: videogenerator
      POSTGRES_USER: video
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d videogenerator"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-63790}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kokoro:
    image: ${KOKORO_IMAGE:?KOKORO_IMAGE must be pinned to an approved immutable digest}
    restart: unless-stopped
    mem_limit: ${KOKORO_MEMORY_LIMIT:-2560m}
    ports:
      # Keep localhost as the safe default. Set KOKORO_BIND_IP to a trusted LAN
      # address only when another machine must call the provider directly.
      - "${KOKORO_BIND_IP:-127.0.0.1}:${KOKORO_PORT:-8880}:8880"
    expose:
      - "8880"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/docs', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 20s

  storage-init:
    image: videoforge-app:latest
    user: root
    command: ["sh", "-c", "mkdir -p /app/storage/media-bank /app/renders /app/.cache && chown -R node:node /app/renders /app/.cache /app/storage"]
    restart: "no"
    volumes:
      - ./storage/media-bank:/app/storage/media-bank
      - video_data:/app/renders
      - engine_cache:/app/.cache
      - webpack_cache:/app/node_modules/.cache

  api:
    image: videoforge-app:latest
    build: .
    restart: unless-stopped
    init: true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *app-environment
      VIDEO_PROCESS_ROLE: api
      PORT: 3000
    ports:
      # The authenticated API is reachable from trusted devices on the LAN.
      # PostgreSQL and Redis remain local; Kokoro is local unless explicitly LAN-bound.
      - "${VIDEO_API_BIND_IP:-127.0.0.1}:${VIDEO_API_PORT:-3000}:3000"
    volumes:
      - ./storage/media-bank:/app/storage/media-bank
      - video_data:/app/renders
      - engine_cache:/app/.cache
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${VIDEO_API_MEMORY_LIMIT:-1g}
    cpus: ${VIDEO_API_CPU_LIMIT:-1.0}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      worker: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    image: videoforge-app:latest
    build: .
    restart: unless-stopped
    # Give the application time to persist an interrupted render as resumable
    # and release its BullMQ lease before Docker sends SIGKILL.
    stop_grace_period: ${VIDEO_WORKER_STOP_GRACE_PERIOD:-2m}
    init: true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["npm", "run", "worker"]
    environment:
      <<: *app-environment
      VIDEO_PROCESS_ROLE: worker
    shm_size: "2gb"
    volumes:
      - ./storage/media-bank:/app/storage/media-bank
      - video_data:/app/renders
      - engine_cache:/app/.cache
      - webpack_cache:/app/node_modules/.cache
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${VIDEO_WORKER_MEMORY_LIMIT:-4g}
    cpus: ${VIDEO_WORKER_CPU_LIMIT:-4.0}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kokoro: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }

volumes:
  postgres_data:
  redis_data:
  video_data:
  engine_cache:
  webpack_cache:
